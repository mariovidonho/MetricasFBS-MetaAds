<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  (function() {
    const host = window.location.hostname.toLowerCase();
    if (host.includes('mpereira') && !window.location.pathname.includes('dashboard_mpereira')) {
      window.location.replace('/dashboard_mpereira.html' + window.location.search);
    } else if (host.includes('fbs') && !window.location.pathname.includes('index.html')) {
      window.location.replace('/' + window.location.search);
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP Capital — Dashboard de Campanhas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #1B3A6B;
    --navy2:   #122d57;
    --navy3:   #0E2347;
    --gold:    #B8902A;
    --gold2:   #D4AA45;
    --white:   #FFFFFF;
    --offwhite:#F8FAFD;
    --muted:   #7A9CC4;
    --border:  rgba(184,144,42,0.15);
    --card-bg: rgba(255,255,255,0.05);
    --success: #27AE60;
    --danger:  #E74C3C;
    --warn:    #F39C12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(160deg, #0E2347 0%, #1B3A6B 50%, #122d57 100%);
    background-attachment: fixed;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: rgba(14, 35, 71, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-mark {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: var(--navy3);
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(184,144,42,0.3);
  }

  .logo-text { display: flex; flex-direction: column; gap: 2px; }
  .logo-title { font-size: 15px; font-weight: 700; color: var(--white); letter-spacing: 0.3px; }
  .logo-sub { font-size: 10px; font-weight: 400; color: var(--gold2); letter-spacing: 2px; text-transform: uppercase; }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .periodo-badge {
    background: rgba(184,144,42,0.1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 500;
    color: var(--gold2);
  }

  .update-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── MAIN ── */
  main { max-width: 1280px; margin: 0 auto; padding: 2rem 2rem 4rem; }

  .section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 1rem;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ── CARDS ── */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(184,144,42,0.12);
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }

  .card:hover { border-color: rgba(184,144,42,0.35); transform: translateY(-2px); background: rgba(255,255,255,0.07); }

  .card.highlight {
    background: linear-gradient(135deg, rgba(184,144,42,0.1), rgba(184,144,42,0.04));
    border-color: rgba(184,144,42,0.28);
  }

  .card-stripe {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--navy3), var(--gold), var(--navy3));
    opacity: 0.6;
  }

  .card.highlight .card-stripe { opacity: 1; }

  .card-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.7rem; }
  .card-value { font-size: 2rem; font-weight: 700; color: var(--white); line-height: 1; margin-bottom: 0.4rem; letter-spacing: -0.5px; }
  .card.highlight .card-value { color: var(--gold2); }
  .card-sub { font-size: 11px; color: var(--muted); }
  .card-icon { position: absolute; top: 1.2rem; right: 1.2rem; font-size: 18px; opacity: 0.2; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 6px;
  }
  .status-ok  { background: rgba(39,174,96,0.12);  color: #27AE60; border: 1px solid rgba(39,174,96,0.2); }
  .status-warn{ background: rgba(243,156,18,0.12); color: #F39C12; border: 1px solid rgba(243,156,18,0.2); }
  .status-bad { background: rgba(231,76,60,0.12);  color: #E74C3C; border: 1px solid rgba(231,76,60,0.2); }

  /* ── REC BOX ── */
  .rec-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(184,144,42,0.15);
    border-radius: 14px; padding: 1.4rem 1.8rem;
    margin-bottom: 2.5rem;
    display: flex; align-items: center; gap: 1.2rem;
  }
  .rec-icon { font-size: 28px; flex-shrink: 0; }
  .rec-content { flex: 1; }
  .rec-title { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .rec-text { font-size: 14px; font-weight: 500; color: var(--white); }

  /* ── TABLE ── */
  .table-wrap { background: rgba(255,255,255,0.03); border: 1px solid rgba(184,144,42,0.12); border-radius: 14px; overflow: hidden; }
  .table-header { padding: 1.2rem 1.8rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .table-title { font-size: 13px; font-weight: 600; }
  .table-sub { font-size: 11px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { background: rgba(255,255,255,0.03); padding: 0.9rem 1.2rem; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 0.9rem 1.2rem; white-space: nowrap; }
  .td-muted { color: var(--muted); }
  .td-gold { color: var(--gold2); font-weight: 600; }
  .td-good { color: #27AE60; font-weight: 600; }
  .td-bad  { color: #E74C3C; font-weight: 600; }
  .td-warn { color: #F39C12; font-weight: 600; }

  .loading { text-align: center; padding: 4rem; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(184,144,42,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.2); border-radius: 14px; padding: 2rem; text-align: center; color: #E74C3C; }

  footer { text-align: center; padding: 2rem; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; }
  .footer-brand { color: var(--gold); font-weight: 600; }

  @media (max-width: 768px) {
    header { padding: 0 1rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
    .card-value { font-size: 1.5rem; }
    .header-right { display: none; }
    .filter-bar { flex-direction: column; align-items: stretch; }
    .filter-group { justify-content: space-between; width: 100%; }
  }
  /* ── BARRA DE FILTROS ── */
  .filter-bar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .filter-pills {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0, 0, 0, 0.2);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .filter-pill {
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-pill:hover {
    color: var(--white);
    background: rgba(255, 255, 255, 0.05);
  }

  .filter-pill.active {
    background: linear-gradient(135deg, rgba(184,144,42,0.25), rgba(184,144,42,0.1));
    color: var(--gold2);
    border: 1px solid rgba(184,144,42,0.3);
    font-weight: 600;
  }

  .filter-select {
    background: rgba(0, 0, 0, 0.3);
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-select:focus, .filter-select:hover {
    border-color: var(--gold2);
  }

  .filter-custom-dates {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-date-input {
    background: rgba(0, 0, 0, 0.3);
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    outline: none;
    color-scheme: dark;
  }

  .filter-date-input:focus {
    border-color: var(--gold2);
  }

  .date-separator {
    font-size: 11px;
    color: var(--muted);
  }

  .filter-btn-action {
    background: rgba(184,144,42,0.15);
    color: var(--gold2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn-action:hover {
    background: var(--gold2);
    color: var(--navy3);
  }

  .empty-state-box {
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 3rem;
    text-align: center;
    margin: 2rem 0;
  }

  .empty-state-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--gold2);
    margin-bottom: 0.5rem;
  }

  .empty-state-desc {
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-mark">DSP</div>
    <div class="logo-text">
      <span class="logo-title">DSP Capital</span>
      <span class="logo-sub">Dashboard de Campanhas</span>
    </div>
  </div>
  <div class="header-right">
    <div class="periodo-badge" id="periodo-badge">Carregando...</div>
    <div class="update-dot">
      <div class="dot"></div>
      <span id="ultima-atualizacao">Atualizando...</span>
    </div>
  </div>
</header>

<main>
  <!-- BARRA DE FILTROS TEMPORAIS -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Filtrar Período:</span>
      <div class="filter-pills">
        <button id="btn-filter-current" class="filter-pill active" onclick="setFilter('current_month')">Mês Atual</button>
        <button id="btn-filter-last" class="filter-pill" onclick="setFilter('last_month')">Mês Passado</button>
        <button id="btn-filter-30days" class="filter-pill" onclick="setFilter('30days')">Últimos 30 Dias</button>
        <button id="btn-filter-all" class="filter-pill" onclick="setFilter('all')">Todo o Histórico</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Mês Específico:</span>
      <select id="select-month-filter" class="filter-select" onchange="onSelectMonthChange(this.value)">
        <option value="">Carregando meses...</option>
      </select>
    </div>

    <div class="filter-group filter-custom-dates">
      <span class="filter-label">Intervalo Personalizado:</span>
      <div class="date-inputs">
        <input type="date" id="filter-start-date" class="filter-date-input" onchange="applyCustomRange()">
        <span class="date-separator">até</span>
        <input type="date" id="filter-end-date" class="filter-date-input" onchange="applyCustomRange()">
        <button id="btn-apply-range" class="filter-btn-action" onclick="applyCustomRange()">Aplicar</button>
      </div>
    </div>
  </div>

  <div id="conteudo">
    <div class="loading"><div class="spinner"></div><p>Carregando dados das campanhas...</p></div>
  </div>
</main>

<footer>
  Atualizado automaticamente a cada hora &nbsp;·&nbsp;
  <span class="footer-brand">DSP Capital</span>
  &nbsp;·&nbsp; Gestão de Tráfego Pago
</footer>

<script>
const SHEET_ID = '1R57uLnST_AiuifWXfdCcBJc6ubNLypFXsDA67twyzRM';
const ABA      = 'DSP_Capital';
const API_KEY  = 'AIzaSyC_YBo_sy5QaG8kDDrPYaLt2YcPhR1pjN0';
const META_CPL = 2.00;

let cachedData = null;
let activeFilter = 'current_month';
let selectedCustomMonth = '';
let customStartDate = null;
let customEndDate = null;
let currentFilteredData = [];

const NOMES_MESES = [
  'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
  'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
];

function parseRowDate(dataStr) {
  if (!dataStr || dataStr === '-') return null;
  const str = String(dataStr).trim();
  if (str.match(/^\d{4}-\d{2}-\d{2}/)) {
    const parts = str.split(' ');
    const d = parts[0];
    const t = parts[1] || '00:00';
    return new Date(`${d}T${t.length === 5 ? t + ':00' : t}`);
  }
  if (str.match(/^\d{2}\/\d{2}\/\d{4}/)) {
    const parts = str.split(' ');
    const [day, month, year] = parts[0].split('/');
    const t = parts[1] || '00:00';
    return new Date(`${year}-${month}-${day}T${t.length === 5 ? t + ':00' : t}`);
  }
  const parsed = new Date(str);
  return isNaN(parsed.getTime()) ? null : parsed;
}

function extractMonths(historico) {
  const monthsMap = new Map();
  historico.forEach(row => {
    const dt = parseRowDate(row.data_atualizacao);
    if (dt) {
      const y = dt.getFullYear();
      const m = (dt.getMonth() + 1).toString().padStart(2, '0');
      const key = `${y}-${m}`;
      const label = `${NOMES_MESES[dt.getMonth()]} / ${y}`;
      if (!monthsMap.has(key)) {
        monthsMap.set(key, { key, label, year: y, month: dt.getMonth() });
      }
    }
  });
  return Array.from(monthsMap.values()).sort((a, b) => b.key.localeCompare(a.key));
}

function updateMonthSelectOptions(historico) {
  const select = document.getElementById('select-month-filter');
  if (!select) return;

  const months = extractMonths(historico);
  let html = '<option value="">Selecionar Mês...</option>';
  months.forEach(m => {
    const selected = (activeFilter === 'custom_month' && selectedCustomMonth === m.key) ? 'selected' : '';
    html += `<option value="${m.key}" ${selected}>${m.label}</option>`;
  });
  select.innerHTML = html;
}

function filterHistorico(historico) {
  if (!historico || historico.length === 0) return [];
  if (activeFilter === 'all') return historico;

  let maxDate = null;
  const parsedRows = historico.map(r => {
    const dt = parseRowDate(r.data_atualizacao);
    if (dt && (!maxDate || dt > maxDate)) maxDate = dt;
    return { row: r, dt };
  }).filter(item => item.dt !== null);

  if (!maxDate) return historico;

  const refYear = maxDate.getFullYear();
  const refMonth = maxDate.getMonth();

  if (activeFilter === 'current_month') {
    return parsedRows
      .filter(item => item.dt.getFullYear() === refYear && item.dt.getMonth() === refMonth)
      .map(item => item.row);
  }

  if (activeFilter === 'last_month') {
    const lastMonthDate = new Date(refYear, refMonth - 1, 1);
    const targetYear = lastMonthDate.getFullYear();
    const targetMonth = lastMonthDate.getMonth();
    return parsedRows
      .filter(item => item.dt.getFullYear() === targetYear && item.dt.getMonth() === targetMonth)
      .map(item => item.row);
  }

  if (activeFilter === '30days') {
    const cutoff = new Date(maxDate.getTime() - (30 * 24 * 60 * 60 * 1000));
    return parsedRows
      .filter(item => item.dt >= cutoff)
      .map(item => item.row);
  }

  if (activeFilter === 'custom_month' && selectedCustomMonth) {
    const [yStr, mStr] = selectedCustomMonth.split('-');
    const targetYear = parseInt(yStr, 10);
    const targetMonth = parseInt(mStr, 10) - 1;
    return parsedRows
      .filter(item => item.dt.getFullYear() === targetYear && item.dt.getMonth() === targetMonth)
      .map(item => item.row);
  }

  if (activeFilter === 'custom_range') {
    const start = customStartDate ? new Date(customStartDate + 'T00:00:00') : null;
    const end = customEndDate ? new Date(customEndDate + 'T23:59:59') : null;
    return parsedRows
      .filter(item => {
        if (start && item.dt < start) return false;
        if (end && item.dt > end) return false;
        return true;
      })
      .map(item => item.row);
  }

  return historico;
}

function updateFilterUI() {
  document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
  
  if (activeFilter === 'current_month') {
    const btn = document.getElementById('btn-filter-current');
    if (btn) btn.classList.add('active');
  } else if (activeFilter === 'last_month') {
    const btn = document.getElementById('btn-filter-last');
    if (btn) btn.classList.add('active');
  } else if (activeFilter === '30days') {
    const btn = document.getElementById('btn-filter-30days');
    if (btn) btn.classList.add('active');
  } else if (activeFilter === 'all') {
    const btn = document.getElementById('btn-filter-all');
    if (btn) btn.classList.add('active');
  }

  const select = document.getElementById('select-month-filter');
  if (select && activeFilter !== 'custom_month') {
    select.value = '';
  }
}

function setFilter(type) {
  activeFilter = type;
  updateFilterUI();
  if (cachedData) {
    render(cachedData);
  }
}

function onSelectMonthChange(val) {
  if (!val) return;
  activeFilter = 'custom_month';
  selectedCustomMonth = val;
  updateFilterUI();
  if (cachedData) {
    render(cachedData);
  }
}

function applyCustomRange() {
  const startInput = document.getElementById('filter-start-date').value;
  const endInput = document.getElementById('filter-end-date').value;
  if (!startInput && !endInput) return;

  activeFilter = 'custom_range';
  customStartDate = startInput;
  customEndDate = endInput;
  updateFilterUI();
  if (cachedData) {
    render(cachedData);
  }
}

async function fetchDados() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${ABA}?key=${API_KEY}`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`Erro ao buscar dados: ${res.status}`);
  const json = await res.json();
  const rows = json.values || [];
  if (rows.length < 2) throw new Error('Sem dados na planilha');
  const headers  = rows[0];
  const dataRows = rows.slice(1);
  const ultima   = dataRows[dataRows.length - 1];
  const obj = {};
  headers.forEach((h,i) => obj[h] = ultima[i]||'');
  return { ultima: obj, historico: dataRows.map(r => { const o={}; headers.forEach((h,i)=>o[h]=r[i]||''); return o; }) };
}

const fmt = {
  brl: v => `R$ ${parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`,
  num: v => parseInt(v||0).toLocaleString('pt-BR'),
  pct: v => `${parseFloat(v||0).toFixed(2)}%`,
  dec: v => parseFloat(v||0).toFixed(2),
};

function classCPL(cpl) {
  const v = parseFloat(cpl);
  if (v===0) return 'td-muted';
  if (v<=META_CPL) return 'td-good';
  if (v<=META_CPL*1.5) return 'td-warn';
  return 'td-bad';
}

function render({ ultima, historico }) {
  updateMonthSelectOptions(historico);
  updateFilterUI();

  const historicoFiltrado = filterHistorico(historico);
  currentFilteredData = historicoFiltrado;

  if (historicoFiltrado.length === 0) {
    document.getElementById('periodo-badge').textContent = 'Sem registros';
    document.getElementById('conteudo').innerHTML = `
      <div class="empty-state-box">
        <div class="empty-state-title">Nenhum dado encontrado para este período</div>
        <p class="empty-state-desc">Tente selecionar outro mês ou ajuste o intervalo personalizado nas opções acima.</p>
      </div>
    `;
    return;
  }

  const d = historicoFiltrado[historicoFiltrado.length - 1];

  let badgeText = d.periodo || 'Mês atual';
  if (activeFilter === 'last_month') {
    const dt = parseRowDate(d.data_atualizacao);
    if (dt) badgeText = `Mês Passado (${NOMES_MESES[dt.getMonth()]}/${dt.getFullYear()})`;
  } else if (activeFilter === 'current_month') {
    const dt = parseRowDate(d.data_atualizacao);
    if (dt) badgeText = `Mês Atual (${NOMES_MESES[dt.getMonth()]}/${dt.getFullYear()})`;
  } else if (activeFilter === '30days') {
    badgeText = 'Últimos 30 dias';
  } else if (activeFilter === 'all') {
    badgeText = 'Todo o Histórico';
  } else if (activeFilter === 'custom_month' && selectedCustomMonth) {
    const [yStr, mStr] = selectedCustomMonth.split('-');
    const mIdx = parseInt(mStr, 10) - 1;
    badgeText = `${NOMES_MESES[mIdx]} / ${yStr}`;
  } else if (activeFilter === 'custom_range') {
    badgeText = 'Intervalo Personalizado';
  }

  document.getElementById('periodo-badge').textContent = badgeText;
  document.getElementById('ultima-atualizacao').textContent = `Atualizado ${d.data_atualizacao||'—'}`;

  const recEmoji = (d.recomendacao||'').startsWith('🔴') ? '🔴' : (d.recomendacao||'').startsWith('🟡') ? '🟡' : '✅';
  const statusClass = recEmoji==='🔴' ? 'status-bad' : recEmoji==='🟡' ? 'status-warn' : 'status-ok';
  const cplNum = parseFloat(d.cpl||0);
  const cplClass = cplNum===0 ? '' : cplNum<=META_CPL ? 'status-ok' : cplNum<=META_CPL*1.5 ? 'status-warn' : 'status-bad';
  const recentes = [...historicoFiltrado].slice(-15).reverse();

  document.getElementById('conteudo').innerHTML = `
    <div class="section-label">Métricas do período</div>
    <div class="cards-grid">
      <div class="card highlight">
        <div class="card-stripe"></div>
        <div class="card-icon">💰</div>
        <div class="card-label">Gasto Total</div>
        <div class="card-value">${fmt.brl(d.gasto_total)}</div>
        <div class="card-sub">Hoje: ${fmt.brl(d.gasto_hoje)}</div>
      </div>
      <div class="card">
        <div class="card-stripe"></div>
        <div class="card-icon">👥</div>
        <div class="card-label">Leads Gerados</div>
        <div class="card-value">${fmt.num(d.leads)}</div>
        <div class="card-sub">No mês atual</div>
      </div>
      <div class="card highlight">
        <div class="card-stripe"></div>
        <div class="card-icon">🎯</div>
        <div class="card-label">CPL</div>
        <div class="card-value">${fmt.brl(d.cpl)}</div>
        <div class="card-sub"><span class="status-badge ${cplClass}">Meta: ${fmt.brl(META_CPL)}</span></div>
      </div>
      <div class="card">
        <div class="card-stripe"></div>
        <div class="card-icon">📈</div>
        <div class="card-label">CTR</div>
        <div class="card-value">${fmt.pct(d.ctr)}</div>
        <div class="card-sub">Taxa de cliques</div>
      </div>
      <div class="card">
        <div class="card-stripe"></div>
        <div class="card-icon">🖱️</div>
        <div class="card-label">CPC</div>
        <div class="card-value">${fmt.brl(d.cpc)}</div>
        <div class="card-sub">Custo por clique</div>
      </div>
      <div class="card">
        <div class="card-stripe"></div>
        <div class="card-icon">👁️</div>
        <div class="card-label">Impressões</div>
        <div class="card-value">${fmt.num(d.impressoes)}</div>
        <div class="card-sub">Alcance: ${fmt.num(d.alcance)}</div>
      </div>
      <div class="card">
        <div class="card-stripe"></div>
        <div class="card-icon">🔄</div>
        <div class="card-label">Frequência</div>
        <div class="card-value">${fmt.dec(d.frequencia)}</div>
        <div class="card-sub">Média por pessoa</div>
      </div>
      <div class="card highlight">
        <div class="card-stripe"></div>
        <div class="card-icon">📊</div>
        <div class="card-label">ROAS</div>
        <div class="card-value">${fmt.dec(d.roas)}x</div>
        <div class="card-sub">Retorno sobre investimento</div>
      </div>
    </div>

    <div class="section-label">Análise automática</div>
    <div class="rec-box">
      <div class="rec-icon">${recEmoji}</div>
      <div class="rec-content">
        <div class="rec-title">Recomendação do sistema</div>
        <div class="rec-text">${(d.recomendacao||'Sem dados').replace(/^[🔴🟡✅⚪]\s*/,'')}</div>
      </div>
      <span class="status-badge ${statusClass}">${d.status_orcamento||''}</span>
    </div>

    <div class="section-label">Histórico recente</div>
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Registros por atualização</span>
        <span class="table-sub">Últimas ${recentes.length} atualizações</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Atualização</th><th>Gasto Total</th><th>Gasto Hoje</th>
              <th>Leads</th><th>CPL</th><th>CTR</th><th>CPC</th>
              <th>Impressões</th><th>Alcance</th><th>Freq.</th><th>ROAS</th><th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${recentes.map(r=>`
              <tr>
                <td class="td-muted">${r.data_atualizacao||'—'}</td>
                <td class="td-gold">${fmt.brl(r.gasto_total)}</td>
                <td>${fmt.brl(r.gasto_hoje)}</td>
                <td>${fmt.num(r.leads)}</td>
                <td class="${classCPL(r.cpl)}">${fmt.brl(r.cpl)}</td>
                <td>${fmt.pct(r.ctr)}</td>
                <td>${fmt.brl(r.cpc)}</td>
                <td class="td-muted">${fmt.num(r.impressoes)}</td>
                <td class="td-muted">${fmt.num(r.alcance)}</td>
                <td>${fmt.dec(r.frequencia)}</td>
                <td>${fmt.dec(r.roas)}x</td>
                <td><span class="status-badge ${(r.status_orcamento||'').includes('⚠️')?'status-warn':'status-ok'}">${(r.status_orcamento||'—').replace('✅ ','').replace('⚠️ ','')}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function init() {
  try {
    const dados = await fetchDados();
    cachedData = dados;
    render(dados);
  } catch(err) {
    document.getElementById('conteudo').innerHTML = `
      <div class="error-box">
        <p style="font-size:24px;margin-bottom:8px">⚠️</p>
        <p style="font-weight:600;margin-bottom:4px">Erro ao carregar dados</p>
        <p style="font-size:12px;opacity:0.7">${err.message}</p>
      </div>`;
  }
}

init();
setInterval(init, 5*60*1000);
</script>
</body>
</html>
