<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPereira Representação — Dashboard de Campanhas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark:    #0A1628;
    --dark2:   #0D1E38;
    --dark3:   #111F35;
    --gold:    #C9A020;
    --gold2:   #E8BE45;
    --gold3:   #F5D878;
    --white:   #FFFFFF;
    --muted:   #6B87A8;
    --border:  rgba(201,160,32,0.15);
    --card-bg: rgba(255,255,255,0.03);
    --success: #2ECC71;
    --danger:  #E74C3C;
    --warn:    #F39C12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* Textura sutil no fundo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(201,160,32,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(201,160,32,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    background: rgba(10,22,40,0.97);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-area { display: flex; align-items: center; gap: 16px; }

  .logo-monogram {
    width: 46px;
    height: 46px;
    background: linear-gradient(145deg, #C9A020, #E8BE45, #C9A020);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--dark);
    box-shadow: 0 4px 16px rgba(201,160,32,0.35);
    letter-spacing: -1px;
  }

  .logo-text { display: flex; flex-direction: column; gap: 2px; }
  .logo-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: var(--white); letter-spacing: 0.3px; }
  .logo-sub { font-size: 9px; font-weight: 500; color: var(--gold2); letter-spacing: 3px; text-transform: uppercase; }

  .header-right { display: flex; align-items: center; gap: 16px; }
  .periodo-badge { background: rgba(201,160,32,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 11px; font-weight: 500; color: var(--gold2); }
  .update-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── SELETOR DE CONTA ── */
  .conta-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 2rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
  }

  .conta-btn {
    flex: 1;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .conta-btn:hover { color: var(--white); background: rgba(255,255,255,0.04); }

  .conta-btn.ativo {
    background: linear-gradient(135deg, rgba(201,160,32,0.2), rgba(201,160,32,0.08));
    color: var(--gold2);
    border: 1px solid rgba(201,160,32,0.3);
    font-weight: 600;
  }

  /* ── MAIN ── */
  main { max-width: 1280px; margin: 0 auto; padding: 2rem 2rem 4rem; position: relative; z-index: 1; }

  .section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 1rem;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ── CARDS ── */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }

  .card {
    background: var(--card-bg);
    border: 1px solid rgba(201,160,32,0.1);
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }

  .card:hover { border-color: rgba(201,160,32,0.35); transform: translateY(-2px); }

  .card.highlight {
    background: linear-gradient(135deg, rgba(201,160,32,0.09), rgba(201,160,32,0.03));
    border-color: rgba(201,160,32,0.25);
  }

  .card-glow {
    position: absolute; bottom: -20px; right: -20px;
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(201,160,32,0.12), transparent);
    border-radius: 50%;
  }

  .card-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.7rem; }
  .card-value { font-size: 2rem; font-weight: 700; color: var(--white); line-height: 1; margin-bottom: 0.4rem; letter-spacing: -0.5px; }
  .card.highlight .card-value { color: var(--gold2); }
  .card-sub { font-size: 11px; color: var(--muted); }
  .card-icon { position: absolute; top: 1.2rem; right: 1.4rem; font-size: 18px; opacity: 0.18; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 6px;
  }
  .status-ok  { background: rgba(46,204,113,0.1);  color: #2ECC71; border: 1px solid rgba(46,204,113,0.2); }
  .status-warn{ background: rgba(243,156,18,0.1);  color: #F39C12; border: 1px solid rgba(243,156,18,0.2); }
  .status-bad { background: rgba(231,76,60,0.1);   color: #E74C3C; border: 1px solid rgba(231,76,60,0.2); }

  /* ── REC BOX ── */
  .rec-box {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.4rem 1.8rem; margin-bottom: 2.5rem;
    display: flex; align-items: center; gap: 1.2rem;
  }
  .rec-icon { font-size: 28px; flex-shrink: 0; }
  .rec-content { flex: 1; }
  .rec-title { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .rec-text { font-size: 14px; font-weight: 500; color: var(--white); }

  /* ── TABLE ── */
  .table-wrap { background: var(--card-bg); border: 1px solid rgba(201,160,32,0.1); border-radius: 14px; overflow: hidden; }
  .table-header { padding: 1.2rem 1.8rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .table-title { font-size: 13px; font-weight: 600; }
  .table-sub { font-size: 11px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { background: rgba(255,255,255,0.02); padding: 0.9rem 1.2rem; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 0.9rem 1.2rem; white-space: nowrap; }
  .td-muted { color: var(--muted); }
  .td-gold { color: var(--gold2); font-weight: 600; }
  .td-good { color: #2ECC71; font-weight: 600; }
  .td-bad  { color: #E74C3C; font-weight: 600; }
  .td-warn { color: #F39C12; font-weight: 600; }

  .loading { text-align: center; padding: 4rem; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(201,160,32,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.2); border-radius: 14px; padding: 2rem; text-align: center; color: #E74C3C; }

  footer { text-align: center; padding: 2rem; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; position: relative; z-index: 1; }
  .footer-brand { color: var(--gold); font-weight: 600; font-family: 'Playfair Display', serif; }

  @media (max-width: 768px) {
    header { padding: 0 1rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
    .card-value { font-size: 1.5rem; }
    .header-right { display: none; }
    .conta-btn { font-size: 11px; padding: 8px 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-monogram">MP</div>
    <div class="logo-text">
      <span class="logo-title">MPereira Representação</span>
      <span class="logo-sub">Dashboard de Campanhas</span>
    </div>
  </div>
  <div class="header-right">
    <div class="periodo-badge" id="periodo-badge">Carregando...</div>
    <div class="update-dot">
      <div class="dot"></div>
      <span id="ultima-atualizacao">Atualizando...</span>
    </div>
  </div>
</header>

<main>
  <!-- Seletor de conta -->
  <div class="conta-selector">
    <button class="conta-btn ativo" onclick="selecionarConta('BM_M_Central', this)">🏢 Central</button>
    <button class="conta-btn" onclick="selecionarConta('BM_M_Secundaria', this)">📌 Secundária</button>
    <button class="conta-btn" onclick="selecionarConta('BM_M_Terciaria', this)">🔹 Terciária</button>
  </div>

  <div id="conteudo">
    <div class="loading"><div class="spinner"></div><p>Carregando dados das campanhas...</p></div>
  </div>
</main>

<footer>
  Atualizado automaticamente a cada hora &nbsp;·&nbsp;
  <span class="footer-brand">MPereira Representação</span>
  &nbsp;·&nbsp; Gestão de Tráfego Pago
</footer>

<script>
const SHEET_ID = '1R57uLnST_AiuifWXfdCcBJc6ubNLypFXsDA67twyzRM';
const API_KEY  = 'AIzaSyC_YBo_sy5QaG8kDDrPYaLt2YcPhR1pjN0';
const META_CPL = 2.00;

let contaAtual = 'BM_M_Central';
let cacheContas = {};

async function fetchDados(aba) {
  if (cacheContas[aba]) return cacheContas[aba];
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${aba}?key=${API_KEY}`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`Erro ao buscar dados: ${res.status}`);
  const json = await res.json();
  const rows = json.values || [];
  if (rows.length < 2) throw new Error('Sem dados na planilha');
  const headers  = rows[0];
  const dataRows = rows.slice(1);
  const ultima   = dataRows[dataRows.length - 1];
  const obj = {};
  headers.forEach((h,i) => obj[h] = ultima[i]||'');
  const result = { ultima: obj, historico: dataRows.map(r => { const o={}; headers.forEach((h,i)=>o[h]=r[i]||''); return o; }) };
  cacheContas[aba] = result;
  // Limpa cache após 4 minutos
  setTimeout(() => { delete cacheContas[aba]; }, 4*60*1000);
  return result;
}

const fmt = {
  brl: v => `R$ ${parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`,
  num: v => parseInt(v||0).toLocaleString('pt-BR'),
  pct: v => `${parseFloat(v||0).toFixed(2)}%`,
  dec: v => parseFloat(v||0).toFixed(2),
};

function classCPL(cpl) {
  const v = parseFloat(cpl);
  if (v===0) return 'td-muted';
  if (v<=META_CPL) return 'td-good';
  if (v<=META_CPL*1.5) return 'td-warn';
  return 'td-bad';
}

const nomesContas = {
  BM_M_Central:    'Central',
  BM_M_Secundaria: 'Secundária',
  BM_M_Terciaria:  'Terciária',
};

function render({ ultima, historico }) {
  const d = ultima;
  document.getElementById('periodo-badge').textContent = d.periodo || 'Mês atual';
  document.getElementById('ultima-atualizacao').textContent = `Atualizado ${d.data_atualizacao||'—'}`;

  const recEmoji = (d.recomendacao||'').startsWith('🔴') ? '🔴' : (d.recomendacao||'').startsWith('🟡') ? '🟡' : '✅';
  const statusClass = recEmoji==='🔴' ? 'status-bad' : recEmoji==='🟡' ? 'status-warn' : 'status-ok';
  const cplNum = parseFloat(d.cpl||0);
  const cplClass = cplNum===0 ? '' : cplNum<=META_CPL ? 'status-ok' : cplNum<=META_CPL*1.5 ? 'status-warn' : 'status-bad';
  const recentes = historico.slice(-10).reverse();

  document.getElementById('conteudo').innerHTML = `
    <div class="section-label">Conta ${nomesContas[contaAtual]} — Métricas do período</div>
    <div class="cards-grid">
      <div class="card highlight">
        <div class="card-glow"></div>
        <div class="card-icon">💰</div>
        <div class="card-label">Gasto Total</div>
        <div class="card-value">${fmt.brl(d.gasto_total)}</div>
        <div class="card-sub">Hoje: ${fmt.brl(d.gasto_hoje)}</div>
      </div>
      <div class="card">
        <div class="card-icon">👥</div>
        <div class="card-label">Leads Gerados</div>
        <div class="card-value">${fmt.num(d.leads)}</div>
        <div class="card-sub">No mês atual</div>
      </div>
      <div class="card highlight">
        <div class="card-glow"></div>
        <div class="card-icon">🎯</div>
        <div class="card-label">CPL</div>
        <div class="card-value">${fmt.brl(d.cpl)}</div>
        <div class="card-sub"><span class="status-badge ${cplClass}">Meta: ${fmt.brl(META_CPL)}</span></div>
      </div>
      <div class="card">
        <div class="card-icon">📈</div>
        <div class="card-label">CTR</div>
        <div class="card-value">${fmt.pct(d.ctr)}</div>
        <div class="card-sub">Taxa de cliques</div>
      </div>
      <div class="card">
        <div class="card-icon">🖱️</div>
        <div class="card-label">CPC</div>
        <div class="card-value">${fmt.brl(d.cpc)}</div>
        <div class="card-sub">Custo por clique</div>
      </div>
      <div class="card">
        <div class="card-icon">👁️</div>
        <div class="card-label">Impressões</div>
        <div class="card-value">${fmt.num(d.impressoes)}</div>
        <div class="card-sub">Alcance: ${fmt.num(d.alcance)}</div>
      </div>
      <div class="card">
        <div class="card-icon">🔄</div>
        <div class="card-label">Frequência</div>
        <div class="card-value">${fmt.dec(d.frequencia)}</div>
        <div class="card-sub">Média por pessoa</div>
      </div>
      <div class="card highlight">
        <div class="card-glow"></div>
        <div class="card-icon">📊</div>
        <div class="card-label">ROAS</div>
        <div class="card-value">${fmt.dec(d.roas)}x</div>
        <div class="card-sub">Retorno sobre investimento</div>
      </div>
    </div>

    <div class="section-label">Análise automática</div>
    <div class="rec-box">
      <div class="rec-icon">${recEmoji}</div>
      <div class="rec-content">
        <div class="rec-title">Recomendação do sistema</div>
        <div class="rec-text">${(d.recomendacao||'Sem dados').replace(/^[🔴🟡✅⚪]\s*/,'')}</div>
      </div>
      <span class="status-badge ${statusClass}">${d.status_orcamento||''}</span>
    </div>

    <div class="section-label">Histórico recente — Conta ${nomesContas[contaAtual]}</div>
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Registros por atualização</span>
        <span class="table-sub">Últimas ${recentes.length} atualizações</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Atualização</th><th>Gasto Total</th><th>Gasto Hoje</th>
              <th>Leads</th><th>CPL</th><th>CTR</th><th>CPC</th>
              <th>Impressões</th><th>Alcance</th><th>Freq.</th><th>ROAS</th><th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${recentes.map(r=>`
              <tr>
                <td class="td-muted">${r.data_atualizacao||'—'}</td>
                <td class="td-gold">${fmt.brl(r.gasto_total)}</td>
                <td>${fmt.brl(r.gasto_hoje)}</td>
                <td>${fmt.num(r.leads)}</td>
                <td class="${classCPL(r.cpl)}">${fmt.brl(r.cpl)}</td>
                <td>${fmt.pct(r.ctr)}</td>
                <td>${fmt.brl(r.cpc)}</td>
                <td class="td-muted">${fmt.num(r.impressoes)}</td>
                <td class="td-muted">${fmt.num(r.alcance)}</td>
                <td>${fmt.dec(r.frequencia)}</td>
                <td>${fmt.dec(r.roas)}x</td>
                <td><span class="status-badge ${(r.status_orcamento||'').includes('⚠️')?'status-warn':'status-ok'}">${(r.status_orcamento||'—').replace('✅ ','').replace('⚠️ ','')}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function selecionarConta(aba, btn) {
  contaAtual = aba;
  document.querySelectorAll('.conta-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  document.getElementById('conteudo').innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando...</p></div>';
  try {
    const dados = await fetchDados(aba);
    render(dados);
  } catch(err) {
    document.getElementById('conteudo').innerHTML = `<div class="error-box"><p>⚠️ ${err.message}</p></div>`;
  }
}

async function init() {
  cacheContas = {};
  try {
    const dados = await fetchDados(contaAtual);
    render(dados);
  } catch(err) {
    document.getElementById('conteudo').innerHTML = `
      <div class="error-box">
        <p style="font-size:24px;margin-bottom:8px">⚠️</p>
        <p style="font-weight:600;margin-bottom:4px">Erro ao carregar dados</p>
        <p style="font-size:12px;opacity:0.7">${err.message}</p>
      </div>`;
  }
}

init();
setInterval(init, 5*60*1000);
</script>
</body>
</html>
